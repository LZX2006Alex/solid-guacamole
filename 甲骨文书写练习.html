<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲骨文书写练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #8B4513;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2rem;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .writing-area {
            flex: 1;
            min-width: 300px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            height: 400px;
            border: 2px dashed #8B4513;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: #f9f3e9;
            overflow: hidden;
        }
        
        #writingCanvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .demo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
        }
        
        .tools {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }  button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #8B4513;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        button:hover {
            background-color: #A0522D;
            transform: translateY(-2px);
        }
        
        .template-area {
            flex: 1;
            min-width: 300px;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .template-title {
            font-size: 1.5rem;
            color: #8B4513;
            margin-bottom: 15px;
            text-align: center;
        } .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .character-item {
            background-color: #f9f3e9;
            border: 1px solid #8B4513;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .character-item:hover {
            background-color: #e6d5c3;
            transform: scale(1.05);
        }
        
        .character-info {
            background-color: #f9f3e9;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .character-name {
            font-size: 1.3rem;
            color: #8B4513;
            margin-bottom: 10px;
        }
        
        .character-meaning {
            color: #666;
            line-height: 1.5;
        }
        
        .instructions {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .instructions h2 {
            color: #8B4513;
            margin-bottom: 15px;
        }
        
        .instructions ol {
            margin-left: 20px;
            line-height: 1.6;
        }
        
        .instructions li {
            margin-bottom: 10px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        /* 甲骨文图形样式 - 从第二个文件复制过来 */
        .oracle-human {
            width: 60px;
            height: 80px;
            position: relative;
        }
        
        .oracle-human::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 25px;
            width: 8px;
            height: 30px;
            background: #5c3d2e;
            border-radius: 4px;
        }
        
        .oracle-human::after {
            content: "";
            position: absolute;
            top: 40px;
            left: 15px;
            width: 30px;
            height: 40px;
            border: 4px solid #5c3d2e;
            border-top: none;
            border-radius: 0 0 15px 15px;
        }
        
        .oracle-tree {
            width: 60px;
            height: 80px;
            position: relative;
        }
        
        .oracle-tree::before {
            content: "";

        .oracle-moon {

        .oracle-fire {

        }
        
        .oracle-fire::before {

            background: #5c3d2e;

        }
        
        .oracle-fire::after {
            content: "";
            position: absolute;
            top: 15px;

            width: 30px;
            height: 25px;
            border: 4px solid #5c3d2e;
            border-bottom: none;
            border-radius: 50% 50% 0 0;
        }
        
        .oracle-mountain {
            width: 60px;
            height: 60px;
            position: relative;
        }
        
        .oracle-mountain::before,
        .oracle-mountain::after {
            content: "";
            position: absolute;
            width: 22px;

            background: #5c3d2e;
            border-radius: 4px;
        }
         .oracle-mountain::before {
            top: 20px;
            left: 12px;
            transform: skewX(-10deg);
        }
        
        .oracle-mountain::after {
            top: 20px;
            left: 34px;
            transform: skewX(10deg);
        }
        
        .oracle-rain {
            width: 60px;
            height: 60px;
            position: relative;
        }
        
        .oracle-rain::before {
            content: "";
            position: absolute;
            top: 8px;
            left: 8px;
            width: 44px;
            height: 30px;
            border: 4px solid #5c3d2e;
            border-bottom: none;
            border-radius: 22px 22px 0 0;
        }
        
        .oracle-rain::after {
            content: "";

            top: 38px;

        .oracle-rain .raindrop {

            width: 4px;

            background: #5c3d2e;
            border-radius: 0 0 4px 4px;
        }
        
        .raindrop:nth-child(2) {
            top: 38px;

        }
        
        .raindrop:nth-child(3) {
            top: 38px;
            left: 42px;
        }

        /* 演示动画的甲骨文样式 */
        .demo-oracle {
            opacity: 0.3;
        }

        .demo-human {
            width: 120px;
            height: 160px;
            position: relative;
        }
        
        .demo-human::before {
            content: "";

        .demo-tree {

        .demo-sun {

        .demo-sun::before {

        .demo-moon {

        .demo-moon::before {

        }
        
        .demo-water {

        }
        
        .demo-water::before,

        .demo-water::after {

        .demo-fire {

        .demo-fire::before {

        .demo-mountain {

        .demo-mountain::before,

  .demo-rain .raindrop:nth-child(2) {

        .demo-rain .raindrop:nth-child(3) {

        @media (max-width: 768px) {

</head>
<body>
    <div class="container">
        <header>
            <h1>甲骨文书写练习</h1>
            <p class="subtitle">探索中国古代文字之美，体验甲骨文书写乐趣</p >
        </header>
        
        <div class="instructions">
            <h2>使用说明</h2>
            <ol>
                <li>从右侧选择您想练习的甲骨文字符</li>
                <li>在左侧书写区域用鼠标或触摸屏进行书写练习</li>
                <li>使用"清除"按钮清空书写区域</li>
                <li>使用"演示"按钮查看该字符的标准书写动画</li>
                <li>练习完成后，可以尝试不看模板凭记忆书写</li>
            </ol>
        </div>
        
        <div class="main-content">
            <div class="writing-area">
                <div class="tools">
                    <button id="clearBtn">清除</button>
                    <button id="demoBtn">演示</button>
                    <button id="hintBtn">提示</button>
                </div>
                <div class="canvas-container">
                    <canvas id="writingCanvas"></canvas>
                    <div class="demo-overlay" id="demoOverlay"></div>
                </div>
                <div class="feedback">
                    <p id="feedbackText">请在右侧选择一个字符开始练习</p >
                </div>
            </div>
            <div class="template-area">
                <h2 class="template-title">甲骨文字符模板</h2>
                <div class="character-grid">
                    <div class="character-item" data-char="人" data-meaning="人，象形字，像侧面站立的人形">
                        <div class="oracle-human"></div>
                    </div>
                    <div class="character-item" data-char="日" data-meaning="日，象形字，像太阳的形状">
                        <div class="oracle-sun"></div>
                    </div>
                    <div class="character-item" data-char="月" data-meaning="月，象形字，像月亮的形状">
                        <div class="oracle-moon"></div>
                    </div>
                    <div class="character-item" data-char="水" data-meaning="水，象形字，像流动的水">
                        <div class="oracle-water"></div>
                    </div>
                    <div class="character-item" data-char="火" data-meaning="火，象形字，像火焰的形状">
                        <div class="oracle-fire"></div>
                    </div>
                    <div class="character-item" data-char="木" data-meaning="木，象形字，像树木的形状">
                        <div class="oracle-tree"></div>
                    </div>
                    <div class="character-item" data-char="山" data-meaning="山，象形字，像山峰的形状">
                        <div class="oracle-mountain"></div>
                    </div>
                    <div class="character-item" data-char="雨" data-meaning="雨，象形字，像下雨的样子">
                        <div class="oracle-rain">
                            <div class="raindrop"></div>
                            <div class="raindrop"></div>
                            <div class="raindrop"></div>
                        </div>
                    </div>
                </div>
                
                <div class="character-info">
                    <div class="character-name">当前字符：<span id="currentChar">未选择</span></div>
                    <div class="character-meaning">含义：<span id="currentMeaning">请从上方选择一个字符</span></div>
                </div>
            </div>
        </div>
     <footer>
            <p>甲骨文书写练习 &copy; 2025 | 甲骨文创意学习与文创平台</p >
        </footer>
    </div>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('writingCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const demoBtn = document.getElementById('demoBtn');
        const hintBtn = document.getElementById('hintBtn');
        const feedbackText = document.getElementById('feedbackText');
        const currentCharSpan = document.getElementById('currentChar');
        const currentMeaningSpan = document.getElementById('currentMeaning');
        const characterItems = document.querySelectorAll('.character-item');
        const demoOverlay = document.getElementById('demoOverlay');
        
        // 设置Canvas尺寸
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // 设置绘制样式
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#8B4513';
        }
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 书写状态变量
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentCharacter = '';
        let currentCharacterMeaning = '';
        
        // 开始书写
        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = getCoordinates(e);
        }
        
        // 书写中
        function draw(e) {
            if (!isDrawing) return;
            
            e.preventDefault();
            
            const [x, y] = getCoordinates(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            [lastX, lastY] = [x, y];
        }
        
        // 结束书写
        function stopDrawing() {
            isDrawing = false;
            
            // 简单评估书写
            if (currentCharacter) {
                evaluateWriting();
            }
        }
        
        // 获取坐标（处理鼠标和触摸事件）
        function getCoordinates(e) {
            let x, y;
            
            if (e.type.includes('touch')) {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                x = touch.clientX - rect.left;
                y = touch.clientY - rect.top;
            } else {
                x = e.offsetX;
                y = e.offsetY;
            }
            
            return [x, y];
        }
        
        // 清除画布
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            demoOverlay.style.display = 'none';
            feedbackText.textContent = '画布已清空，请继续练习';
        }
        
        // 演示当前字符
        function demoCharacter() {
            if (!currentCharacter) {
                feedbackText.textContent = '请先选择一个字符';
                return;
            }
            
            clearCanvas();
            feedbackText.textContent = '观看演示中...';
            
            // 创建对应的甲骨文演示图形
            demoOverlay.innerHTML = '';
            demoOverlay.style.display = 'flex';
            
            const demoElement = document.createElement('div');
            demoElement.className = `demo-oracle demo-${getCharacterClass(currentCharacter)}`;
            
            // 为雨字添加雨滴
            if (currentCharacter === '雨') {
                demoElement.innerHTML = `
                    <div class="raindrop"></div>
                    <div class="raindrop"></div>
                    <div class="raindrop"></div>
                `;
            }
            
            demoOverlay.appendChild(demoElement);
            
            setTimeout(() => {
                feedbackText.textContent = '演示完成，请尝试模仿书写';
            }, 1500);
        }
        
        // 获取字符对应的CSS类名
        function getCharacterClass(char) {
            const charMap = {
                '人': 'human',
                '木': 'tree',
                '日': 'sun',
                '月': 'moon',
                '水': 'water',
                '火': 'fire',
                '山': 'mountain',
                '雨': 'rain'
            };
            return charMap[char] || 'human';
        }
        
        // 显示提示
        function showHint() {
            if (!currentCharacter) {
                feedbackText.textContent = '请先选择一个字符';
                return;
            }
            
            feedbackText.textContent = `提示：${currentCharacterMeaning}`;
        }
        
        // 简单评估书写
        function evaluateWriting() {
            // 这里只是一个简单的模拟评估
            const evaluations = [
                "书写得不错，继续练习！",
                "笔画需要更流畅一些",
                "注意字符的比例和结构",
                "基本掌握了这个字符的写法"
            ];
            
            const randomEvaluation = evaluations[Math.floor(Math.random() * evaluations.length)];
            feedbackText.textContent = randomEvaluation;
        }// 选择字符模板
        characterItems.forEach(item => {
            item.addEventListener('click', function() {
                currentCharacter = this.getAttribute('data-char');
                currentCharacterMeaning = this.getAttribute('data-meaning');
                
                currentCharSpan.textContent = currentCharacter;
                currentMeaningSpan.textContent = currentCharacterMeaning;
                
                clearCanvas();
                feedbackText.textContent = `已选择字符"${currentCharacter}"，请在左侧练习书写`;
            });
        });
        
        // 事件监听
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        // 触摸事件支持
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
        
        clearBtn.addEventListener('click', clearCanvas);
        demoBtn.addEventListener('click', demoCharacter);
        hintBtn.addEventListener('click', showHint);
    </script>
</body>
</html>

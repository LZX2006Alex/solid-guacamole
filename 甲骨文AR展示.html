<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲骨文AR展示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f5f1e6;
            color: #333;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(140, 94, 60, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
        }

        header {
            background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 3px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .video-section {
            flex: 1;
            min-width: 320px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 4px solid #8B4513;
            touch-action: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay-oracle {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10;
            left: 50%;
            top: 50%;
        }
        .overlay-oracle.is-following {
            transition: left 0.05s ease-out, top 0.05s ease-out;
        }
        .overlay-oracle img {
            display: block;
            pointer-events: none;
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
            gap: 15px;
        }
        .start-overlay i { font-size: 48px; color: #d4af37; }
        .start-overlay p { font-size: 16px; text-align: center; padding: 0 20px; }
        .start-overlay button {
            padding: 12px 32px;
            background: #d4af37;
            color: #333;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .start-overlay button:hover { transform: scale(1.05); }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }

        .control-section {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid #8B4513;
        }
        .card h3 {
            color: #8B4513;
            font-size: 16px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f5f1e6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-primary {
            background: #8B4513;
            color: white;
        }
        .btn-primary:hover { background: #654321; }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-gold {
            background: #d4af37;
            color: #333;
        }
        .btn-gold:hover { background: #c19b2a; }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .btn-row .btn { flex: 1; }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .char-item {
            aspect-ratio: 1;
            background: #f9f3e9;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .char-item:hover {
            background: #f0e6d3;
            border-color: #d4af37;
        }
        .char-item.active {
            border-color: #8B4513;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(139, 69, 19, 0.2);
        }
        .char-item .char-preview {
            transform: scale(0.7);
        }
        .char-item .char-label {
            position: absolute;
            bottom: 4px;
            font-size: 11px;
            color: #8B4513;
        }

        .slider-group { margin-bottom: 14px; }
        .slider-group:last-child { margin-bottom: 0; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        .slider-label span:last-child {
            color: #8B4513;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #e8dfca;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #8B4513;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .color-row {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.active {
            box-shadow: 0 0 0 2px #8B4513;
            transform: scale(1.1);
        }

        .mode-toggle {
            display: flex;
            background: #f0e6d3;
            border-radius: 6px;
            padding: 3px;
            margin-bottom: 14px;
        }
        .mode-btn {
            flex: 1;
            padding: 7px;
            text-align: center;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
            color: #666;
        }
        .mode-btn.active {
            background: #8B4513;
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #8B4513;
            font-size: 13px;
            opacity: 0.8;
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .control-section {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .card { flex: 1; min-width: 280px; }
        }
        @media (max-width: 480px) {
            header h1 { font-size: 22px; }
            .control-section { flex-direction: column; }
            .card { min-width: auto; }
        }

        /* 电脑端适配（1024px以上） */
        @media (min-width: 1024px) {
            header {
                padding: 30px 20px;
            }
            header h1 {
                font-size: 32px;
                letter-spacing: 4px;
            }
            header p {
                font-size: 16px;
            }
            .container {
                max-width: 1100px;
                margin: 40px auto;
                padding: 0 20px;
                gap: 30px;
            }
            .control-section {
                width: 320px;
                gap: 22px;
            }
            .card {
                padding: 22px;
                border-radius: 16px;
            }
            .card h3 {
                font-size: 18px;
                margin-bottom: 18px;
                padding-bottom: 12px;
            }
            .btn {
                padding: 12px;
                font-size: 15px;
                border-radius: 8px;
            }
            .char-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
            .char-item {
                padding: 12px 8px;
            }
            .char-preview {
                width: 45px;
                height: 45px;
            }
            .char-label {
                font-size: 14px;
            }
            .slider-group label {
                font-size: 14px;
            }
            .slider-group input[type="range"] {
                height: 8px;
            }
            .color-row {
                gap: 12px;
            }
            .color-btn {
                width: 32px;
                height: 32px;
            }
            .mode-switch {
                gap: 8px;
            }
            .mode-btn {
                padding: 10px 16px;
                font-size: 14px;
            }
        }

        /* 大屏电脑端适配（1440px以上） */
        @media (min-width: 1440px) {
            header {
                padding: 35px 20px;
            }
            header h1 {
                font-size: 36px;
                letter-spacing: 6px;
            }
            header p {
                font-size: 17px;
            }
            .container {
                max-width: 1400px;
                margin: 50px auto;
                padding: 0 40px;
                gap: 40px;
            }
            .video-section {
                flex: 1.2;
            }
            .control-section {
                width: 360px;
                gap: 25px;
            }
            .card {
                padding: 28px;
                border-radius: 20px;
                box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            }
            .card h3 {
                font-size: 20px;
                margin-bottom: 20px;
                padding-bottom: 14px;
            }
            .btn {
                padding: 14px;
                font-size: 16px;
                border-radius: 10px;
                font-weight: 600;
            }
            .char-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
            }
            .char-item {
                padding: 15px 10px;
                border-radius: 12px;
            }
            .char-preview {
                width: 50px;
                height: 50px;
            }
            .char-label {
                font-size: 15px;
                margin-top: 8px;
            }
            .slider-group {
                gap: 10px;
            }
            .slider-group label {
                font-size: 15px;
                font-weight: 500;
            }
            .slider-group input[type="range"] {
                height: 10px;
            }
            .slider-value {
                font-size: 14px;
                padding: 4px 10px;
                border-radius: 6px;
            }
            .color-row {
                gap: 15px;
            }
            .color-btn {
                width: 36px;
                height: 36px;
            }
            .mode-switch {
                gap: 10px;
            }
            .mode-btn {
                padding: 12px 20px;
                font-size: 15px;
                border-radius: 10px;
            }
        }

        /* 超宽屏适配（1920px以上） */
        @media (min-width: 1920px) {
            .container {
                max-width: 1700px;
            }
            .control-section {
                width: 400px;
            }
            .card {
                padding: 32px;
            }
            .char-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

<header>
    <h1><i class="fas fa-cube"></i> 甲骨文AR展示</h1>
    <p>通过摄像头实时画面，AR叠加展示古老的甲骨文字形</p>
</header>

<div class="container">
    <div class="video-section">
        <div class="video-wrapper" id="videoWrapper">
            <video id="video" autoplay playsinline muted></video>
            <div class="overlay-oracle" id="overlayOracle"></div>
            <div class="start-overlay" id="startOverlay">
                <i class="fas fa-video"></i>
                <p>点击下方按钮开启摄像头<br>体验甲骨文AR展示</p>
                <button id="startBtn"><i class="fas fa-play"></i> 开始摄像头</button>
            </div>
        </div>
    </div>

    <div class="control-section">
        <div class="card">
            <h3><i class="fas fa-camera"></i> 摄像头控制</h3>
            <button class="btn btn-primary" id="stopBtn" disabled>
                <i class="fas fa-stop"></i> 停止摄像头
            </button>
        </div>

        <div class="card">
            <h3><i class="fas fa-font"></i> 字符选择</h3>
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="follow">跟随模式</button>
                <button class="mode-btn" data-mode="fixed">固定中央</button>
            </div>
            <div class="char-grid" id="charGrid"></div>
        </div>

        <div class="card">
            <h3><i class="fas fa-sliders-h"></i> 字形设置</h3>
            <div class="slider-group">
                <div class="slider-label">
                    <span>字形大小</span>
                    <span id="sizeValue">120px</span>
                </div>
                <input type="range" id="sizeSlider" min="60" max="200" value="120">
            </div>
            <div class="slider-group">
                <div class="slider-label">
                    <span>透明度</span>
                    <span id="opacityValue">0.8</span>
                </div>
                <input type="range" id="opacitySlider" min="30" max="100" value="80">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>字形颜色</span></div>
                <div class="color-row" id="colorRow">
                    <div class="color-btn active" style="background:#5c3d2e" data-color="#5c3d2e"></div>
                    <div class="color-btn" style="background:#8B4513" data-color="#8B4513"></div>
                    <div class="color-btn" style="background:#1a1a1a" data-color="#1a1a1a"></div>
                    <div class="color-btn" style="background:#c0392b" data-color="#c0392b"></div>
                    <div class="color-btn" style="background:#2c7a3a" data-color="#2c7a3a"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-camera-retro"></i> 截图保存</h3>
            <button class="btn btn-gold" id="screenshotBtn" disabled>
                <i class="fas fa-download"></i> 保存截图
            </button>
        </div>
    </div>
</div>

<footer>甲骨文AR展示 © 2025 | 甲骨文创意学习与文创平台</footer>

<script>
    const chars = ['人', '木', '日', '月', '水', '火', '山', '雨'];
    const charSvgPaths = {
        '人': './svg/人.svg', '木': './svg/木.svg', '日': './svg/日.svg', '月': './svg/月.svg',
        '水': './svg/水.svg', '火': './svg/火.svg', '山': './svg/山.svg', '雨': './svg/雨.svg'
    };

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlayOracle');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const screenshotBtn = document.getElementById('screenshotBtn');
    const charGrid = document.getElementById('charGrid');
    const sizeSlider = document.getElementById('sizeSlider');
    const opacitySlider = document.getElementById('opacitySlider');
    const sizeValue = document.getElementById('sizeValue');
    const opacityValue = document.getElementById('opacityValue');
    const colorRow = document.getElementById('colorRow');
    const videoWrapper = document.getElementById('videoWrapper');
    const modeBtns = document.querySelectorAll('.mode-btn');

    let currentChar = '人';
    let stream = null;
    let isFollowing = true;
    let oracleSize = 120;
    let oracleOpacity = 0.8;
    let oracleColor = '#5c3d2e';
    let overlayX = 50, overlayY = 50;

    function initCharGrid() {
        chars.forEach((char, i) => {
            const item = document.createElement('div');
            item.className = 'char-item' + (i === 0 ? ' active' : '');
            item.innerHTML = `
                <img class="char-preview" src="${charSvgPaths[char]}" alt="${char}" style="width:50px;height:50px;filter:sepia(1) hue-rotate(15deg) saturate(2);">
                <span class="char-label">${char}</span>
            `;
            item.addEventListener('click', () => selectChar(char, item));
            charGrid.appendChild(item);
        });
    }

    function selectChar(char, el) {
        currentChar = char;
        updateOverlaySvg();
        if (isFollowing) overlay.classList.add('is-following');
        document.querySelectorAll('.char-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    function updateOverlaySvg() {
        const svgPath = charSvgPaths[currentChar];
        if (svgPath) {
            overlay.innerHTML = `<img src="${svgPath}" alt="${currentChar}" style="width:${oracleSize}px;height:auto;opacity:${oracleOpacity};filter:sepia(1) hue-rotate(${getHueRotate(oracleColor)})deg saturate(2);">`;
        }
    }

    function getHueRotate(color) {
        const colorMap = { '#5c3d2e': 15, '#8B4513': 10, '#1a1a1a': 0, '#c0392b': 320, '#2c7a3a': 120 };
        return colorMap[color] || 15;
    }

    async function startCamera() {
        startOverlay.innerHTML = '<div class="loading-spinner"></div><p>正在启动摄像头...</p>';
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } },
                audio: false
            });
            video.srcObject = stream;
            startOverlay.style.display = 'none';
            stopBtn.disabled = false;
            screenshotBtn.disabled = false;
        } catch (err) {
            console.error('Camera error:', err);
            let msg = '无法访问摄像头';
            if (err.name === 'NotAllowedError') msg = '您拒绝了摄像头权限，请在浏览器设置中允许访问';
            else if (err.name === 'NotFoundError') msg = '未检测到摄像头设备';
            else if (err.name === 'NotReadableError') msg = '摄像头被其他程序占用';
            else if (err.name === 'NotSupportedError') msg = '当前浏览器不支持摄像头功能';
            startOverlay.innerHTML = `
                <i class="fas fa-exclamation-triangle" style="color:#ff6b6b"></i>
                <p class="error-msg">${msg}</p>
                <button id="retryBtn"><i class="fas fa-redo"></i> 重试</button>
            `;
            document.getElementById('retryBtn').addEventListener('click', startCamera);
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        }
        video.srcObject = null;
        startOverlay.style.display = 'flex';
        startOverlay.innerHTML = `
            <i class="fas fa-video"></i>
            <p>点击下方按钮开启摄像头<br>体验甲骨文AR展示</p>
            <button id="startBtn"><i class="fas fa-play"></i> 开始摄像头</button>
        `;
        document.getElementById('startBtn').addEventListener('click', startCamera);
        stopBtn.disabled = true;
        screenshotBtn.disabled = true;
    }

    function moveOverlay(clientX, clientY) {
        if (!isFollowing) return;
        const rect = videoWrapper.getBoundingClientRect();
        const x = ((clientX - rect.left) / rect.width) * 100;
        const y = ((clientY - rect.top) / rect.height) * 100;
        overlayX = Math.max(5, Math.min(95, x));
        overlayY = Math.max(5, Math.min(95, y));
        overlay.style.left = overlayX + '%';
        overlay.style.top = overlayY + '%';
    }

    function updateSize() {
        oracleSize = parseInt(sizeSlider.value);
        sizeValue.textContent = oracleSize + 'px';
        updateOverlaySvg();
    }

    function updateOpacity() {
        oracleOpacity = parseInt(opacitySlider.value) / 100;
        opacityValue.textContent = oracleOpacity.toFixed(2);
        updateOverlaySvg();
    }

    function updateColor(color) {
        oracleColor = color;
        updateOverlaySvg();
    }

    function drawDemoChar(ctx, char, x, y, size, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(size / 120, size / 120);
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        switch(char) {
            case '人':
                ctx.fillRect(50, 20, 16, 60);
                ctx.beginPath();
                ctx.moveTo(30, 80);
                ctx.lineTo(30, 160);
                ctx.quadraticCurveTo(30, 160, 60, 160);
                ctx.lineTo(90, 160);
                ctx.quadraticCurveTo(90, 160, 90, 80);
                ctx.stroke();
                break;
            case '木':
                ctx.fillRect(50, 20, 16, 120);
                ctx.beginPath();
                ctx.moveTo(24, 74);
                ctx.lineTo(24, 24);
                ctx.quadraticCurveTo(24, 24, 62, 24);
                ctx.lineTo(100, 24);
                ctx.quadraticCurveTo(100, 24, 100, 74);
                ctx.stroke();
                break;
            case '日':
                ctx.beginPath();
                ctx.arc(60, 60, 44, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillRect(0, 56, 120, 8);
                break;
            case '月':
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(60, 61, 38, 53, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#f9f3e9';
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.ellipse(31, 61, 23, 53, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                break;
            case '水':
                ctx.fillRect(15, 40, 90, 8);
                ctx.fillRect(15, 70, 90, 8);
                break;
            case '火':
                ctx.fillRect(50, 60, 16, 60);
                ctx.beginPath();
                ctx.moveTo(30, 80);
                ctx.lineTo(30, 30);
                ctx.quadraticCurveTo(30, 30, 60, 30);
                ctx.lineTo(90, 30);
                ctx.quadraticCurveTo(90, 30, 90, 80);
                ctx.stroke();
                break;
            case '山':
                ctx.save();
                ctx.translate(24, 40);
                ctx.transform(1, 0, -0.176, 1, 0, 0);
                ctx.fillRect(0, 0, 44, 80);
                ctx.restore();
                ctx.save();
                ctx.translate(68, 40);
                ctx.transform(1, 0, 0.176, 1, 0, 0);
                ctx.fillRect(0, 0, 44, 80);
                ctx.restore();
                break;
            case '雨':
                ctx.beginPath();
                ctx.moveTo(16, 76);
                ctx.lineTo(16, 16);
                ctx.quadraticCurveTo(16, 16, 60, 16);
                ctx.lineTo(104, 16);
                ctx.quadraticCurveTo(104, 16, 104, 76);
                ctx.stroke();
                ctx.fillRect(20, 76, 8, 44);
                ctx.fillRect(48, 76, 8, 44);
                ctx.fillRect(76, 76, 8, 44);
                break;
        }
        ctx.restore();
    }

    function takeScreenshot() {
        if (!stream) return;
        const canvas = document.createElement('canvas');
        const w = video.videoWidth;
        const h = video.videoHeight;
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, w, h);

        const rect = videoWrapper.getBoundingClientRect();
        const videoRect = video.getBoundingClientRect();
        const scaleX = w / videoRect.width;
        const scaleY = h / videoRect.height;
        const offsetX = (overlayX / 100) * videoRect.width * scaleX;
        const offsetY = (overlayY / 100) * videoRect.height * scaleY;
        const actualSize = oracleSize * scaleX;

        ctx.globalAlpha = oracleOpacity;
        drawDemoChar(ctx, currentChar, offsetX, offsetY, actualSize * 1.5, oracleColor);

        const link = document.createElement('a');
        link.download = `甲骨文AR-${currentChar}-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        Toast.success('截图已保存！');
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    screenshotBtn.addEventListener('click', takeScreenshot);
    sizeSlider.addEventListener('input', updateSize);
    opacitySlider.addEventListener('input', updateOpacity);

    colorRow.addEventListener('click', e => {
        const btn = e.target.closest('.color-btn');
        if (!btn) return;
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateColor(btn.dataset.color);
    });

    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isFollowing = btn.dataset.mode === 'follow';
            if (isFollowing) {
                overlay.classList.add('is-following');
            } else {
                overlay.classList.remove('is-following');
                overlay.style.left = '50%';
                overlay.style.top = '50%';
                overlayX = 50;
                overlayY = 50;
            }
        });
    });

    videoWrapper.addEventListener('mousemove', e => moveOverlay(e.clientX, e.clientY));
    videoWrapper.addEventListener('touchmove', e => {
        e.preventDefault();
        if (e.touches.length > 0) {
            moveOverlay(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: false });

    initCharGrid();
    updateOverlaySvg();
    overlay.classList.add('is-following');
    updateSize();
    updateOpacity();
    updateColor(oracleColor);
</script>
<script src="./js/common.js"></script>
</body>
</html>

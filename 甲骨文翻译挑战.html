<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲骨文翻译挑战</title>
    <link rel="stylesheet" href="./css/common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SimSun', 'STKaiti', serif;
        }
        
        body {
            background: #f5f1e6 url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239C9280' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            min-height: 100vh;
            padding: 20px;
            color: #3a3225;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background-color: rgba(222, 211, 195, 0.8);
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            border: 2px solid #a99275;
        }
        
        h1 {
            color: #7a5c3c;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.1);
            letter-spacing: 3px;
        }
        
        .subtitle {
            color: #8a7355;
            font-size: 1.3rem;
        }
        
        .stats-area {
            display: flex;
            justify-content: space-between;
            background-color: #e8dfd1;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            border: 2px solid #a99275;
            margin-bottom: 30px;
        }
        .stat {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 2.5rem;
            color: #7a5c3c;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 1.1rem;
            color: #5d4c35;
        }
        
        .challenge-area {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .oracle-passage-area {
            flex: 1;
            min-width: 300px;
            background-color: #e8dfd1;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            border: 2px solid #a99275;
        }
        
        .section-title {
            font-size: 1.5rem;
            color: #7a5c3c;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .oracle-bone {
            width: 100%;
            min-height: 300px;
            background-color: #d4c6b0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.2);
            border: 8px solid #b8a58a;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }
        
        .oracle-bone::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
        }
        
        .oracle-text {
            font-size: 2.5rem;
            color: #5d4c35;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            line-height: 1.8;
            text-align: center;
            font-family: 'STKaiti', serif;
        }
        
        .translation-area {
            flex: 1;
            min-width: 300px;
            background-color: #e8dfd1;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            border: 2px solid #a99275;
        }
        
        .input-area {
            margin-bottom: 20px;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #a99275;
            border-radius: 10px;
            background-color: #f9f3e9;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: vertical;
            color: #5d4c35;
        }
        
        textarea:focus {
            outline: none;
            border-color: #7a5c3c;
            box-shadow: 0 0 8px rgba(122, 92, 60, 0.3);
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #8a7355;
            color: #f5f1e6;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            background-color: #7a5c3c;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        .feedback-area {
            background-color: #e8dfd1;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            border: 2px solid #a99275;
            margin-bottom: 30px;
            display: none;
        }
        
        .feedback-title {
            font-size: 1.5rem;
            color: #7a5c3c;
            margin-bottom: 15px;
        }
        
        .feedback-text {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #5d4c35;
            margin-bottom: 20px;
        }
        
        .comparison {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .user-translation, .reference-translation {
            flex: 1;
            min-width: 250px;
            background-color: #d4c6b0;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #a99275;
        }
        .comparison-title {
            font-size: 1.2rem;
            color: #7a5c3c;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .comparison-text {
            line-height: 1.6;
            color: #5d4c35;
        }
        
        .score-display {
            text-align: center;
            font-size: 1.3rem;
            color: #7a5c3c;
            margin-bottom: 15px;
        }
        
        .passage-info {
            background-color: #d4c6b0;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #a99275;
            margin-top: 15px;
        }
        
        .passage-title {
            font-size: 1.2rem;
            color: #7a5c3c;
            margin-bottom: 10px;
        }
        
        .passage-explanation {
            line-height: 1.6;
            color: #5d4c35;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #8a7355;
            font-size: 0.9rem;
        }
        
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .result-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .result-box {
            background-color: #e8dfd1;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid #a99275;
        }
        
        .result-title {
            font-size: 2rem;
            color: #7a5c3c;
            margin-bottom: 20px;
        }
        
        .result-score {
            font-size: 3rem;
            color: #5d4c35;
            margin-bottom: 20px;
        }
        
        .result-message {
            font-size: 1.2rem;
            color: #5d4c35;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .challenge-area {
                flex-direction: column;
            }
            
            .oracle-text {
                font-size: 2rem;
            }
            
            .stats-area {
                flex-direction: column;
                gap: 15px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .comparison {
                flex-direction: column;
            }
        }
        
        @media (max-width: 480px) {
            .oracle-text {
                font-size: 1.8rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>甲骨文段落翻译挑战</h1>
            <p class="subtitle">破译古老文字，探索中华文明之源</p >
        </header>
        
        <div class="stats-area">
            <div class="stat">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">得分</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="passage-count">1/5</div>
                <div class="stat-label">进度</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="accuracy">0%</div>
                <div class="stat-label">准确率</div>
            </div>
        </div>
        
        <div class="challenge-area">
            <div class="oracle-passage-area">
                <h2 class="section-title">甲骨文段落</h2>
                <div class="oracle-bone">
                    <div class="oracle-text" id="oracle-text">今日雨其自西来</div>
                </div>
                <div class="passage-info">
                    <div class="passage-title">段落背景</div>
                    <div class="passage-explanation" id="passage-explanation">这是一段关于天气的甲骨文记载，描述了某日的降雨情况。</div>
                </div>
            </div>
              <div class="translation-area">
                <h2 class="section-title">翻译挑战</h2>
                <div class="input-area">
                    <textarea id="translation-input" placeholder="请在此输入您对甲骨文段落的翻译..."></textarea>
                </div>
                <div class="controls">
                    <button id="hint-btn">提示</button>
                    <button id="submit-btn">提交翻译</button>
                </div>
            </div>
        </div>
        
        <div class="feedback-area" id="feedback-area">
            <h2 class="feedback-title" id="feedback-title">翻译结果</h2>
            <div class="score-display">得分: <span id="current-score">0</span> 分</div>
            <div class="comparison">
                <div class="user-translation">
                    <div class="comparison-title">您的翻译</div>
                    <div class="comparison-text" id="user-translation-text"></div>
                </div>
                <div class="reference-translation">
                    <div class="comparison-title">参考翻译</div>
                    <div class="comparison-text" id="reference-translation-text"></div>
                </div>
            </div>
            <div class="passage-info">
                <div class="passage-title">详细解释</div>
                <div class="passage-explanation" id="detailed-explanation"></div>
            </div>
            <div class="controls">
                <button id="next-btn">下一段落</button>
            </div>
        </div>
        
        <footer>
            <p>甲骨文翻译挑战 &copy; 2025 | 甲骨文创意学习与文创平台</p >
        </footer>
    </div>

    <div class="result-overlay" id="result-overlay">
        <div class="result-box">
            <h2 class="result-title">挑战完成！</h2>
            <div class="result-score" id="final-score">0分</div>
            <p class="result-message" id="result-message">你完成了5段甲骨文的翻译挑战！</p >
            <button id="restart-btn">重新开始</button>
        </div>
    </div>

    <script>
        // 甲骨文段落数据
        const oraclePassages = [
            {
                text: "今日雨其自西来",
                reference: "今天下雨，雨水从西方而来。",
                explanation: "这是一段关于天气的甲骨文记载，描述了某日的降雨情况。",
                detailed: "这段甲骨文记载了商代某日的天气情况。'今日'表示当天，'雨'表示下雨，'其自西来'描述了雨从西方而来。这反映了当时人们对天气的观察和记录。",
                keywords: ["今天", "下雨", "西方", "来"],
                difficulty: 1
            },
            {
                text: "王占曰吉受又",
                reference: "王占卜说：吉利，会受到保佑。",
                explanation: "这是一段关于商王占卜的甲骨文记录。",
                detailed: "这段甲骨文记录了商王进行占卜的结果。'王占曰'表示商王占卜后说，'吉'表示吉利，'受又'意为受到保佑。这反映了商代王权与神权结合的特点。",
                keywords: ["王", "占卜", "吉利", "保佑"],
                difficulty: 2
            },
            {
                text: "贞翌辛卯其出于祖辛",
                reference: "占卜问：下一个辛卯日要对祖辛进行祭祀吗？",
                explanation: "这是一段关于祭祀的甲骨文卜辞。",
                detailed: "这段甲骨文是商代祭祀活动的记录。'贞'表示占卜问事，'翌辛卯'指下一个辛卯日，'其出于祖辛'意为对祖先辛进行祭祀。这反映了商代对祖先的崇拜和频繁的祭祀活动。",
                keywords: ["占卜", "辛卯", "祭祀", "祖辛"],
                difficulty: 3
            },
            {
                text: "癸酉卜亘贞臣得王曰得唯乙允",
                reference: "癸酉日占卜，亘问：能抓到臣仆吗？王说：能抓到，在乙日确实抓到了。",
                explanation: "这是一段关于抓捕臣仆的甲骨文记录。",
                detailed: "这段甲骨文记载了商代一次抓捕臣仆的事件。'癸酉卜'表示在癸酉日占卜，'亘贞'指名为亘的贞人进行占卜，'臣得'问能否抓到臣仆，'王曰得唯乙允'是王的判断和后续验证。",
                keywords: ["癸酉", "占卜", "臣仆", "抓到", "乙日"],
                difficulty: 4
            },
            {
                text: "甲子卜争贞翌乙丑易日乙丑允易日",
                reference: "甲子日占卜，争问：第二天乙丑日会是晴天吗？乙丑日确实是晴天。",
                explanation: "这是一段关于天气预测的甲骨文记录。",
                detailed: "这段甲骨文记录了商代对天气的预测和验证。'甲子卜'表示在甲子日占卜，'争贞'指名为争的贞人进行占卜，'翌乙丑易日'问第二天乙丑日是否会是晴天，'乙丑允易日'是后续的验证结果。",
                keywords: ["甲子", "占卜", "乙丑", "晴天"],
                difficulty: 5
            }
        ];

        // 游戏状态变量
        let score = 0;
        let currentPassage = 0;
        let totalAccuracy = 0;
        let isGameActive = true;
          // DOM元素
        const oracleTextEl = document.getElementById('oracle-text');
        const passageExplanationEl = document.getElementById('passage-explanation');
        const translationInputEl = document.getElementById('translation-input');
        const scoreEl = document.getElementById('score');
        const passageCountEl = document.getElementById('passage-count');
        const accuracyEl = document.getElementById('accuracy');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackTitle = document.getElementById('feedback-title');
        const currentScoreEl = document.getElementById('current-score');
        const userTranslationTextEl = document.getElementById('user-translation-text');
        const referenceTranslationTextEl = document.getElementById('reference-translation-text');
        const detailedExplanationEl = document.getElementById('detailed-explanation');
        const hintBtn = document.getElementById('hint-btn');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const resultOverlay = document.getElementById('result-overlay');
        const finalScoreEl = document.getElementById('final-score');
        const resultMessageEl = document.getElementById('result-message');
        const restartBtn = document.getElementById('restart-btn');

        // 初始化游戏
        function initGame() {
            score = 0;
            currentPassage = 0;
            totalAccuracy = 0;
            isGameActive = true;
            updateStats();
            loadPassage();
            
            // 隐藏反馈区域
            feedbackArea.style.display = 'none';
            
            // 隐藏结果覆盖层
            resultOverlay.classList.remove('active');
            
            // 清空输入
            translationInputEl.value = '';
        }

        // 更新统计信息
        function updateStats() {
            scoreEl.textContent = score;
            passageCountEl.textContent = `${currentPassage + 1}/${oraclePassages.length}`;
            
            const accuracy = currentPassage > 0 ? Math.round(totalAccuracy / currentPassage) : 0;
            accuracyEl.textContent = `${accuracy}%`;
        }

        // 加载段落
        function loadPassage() {
            const passage = oraclePassages[currentPassage];
            
            // 更新甲骨文文本和解释
            oracleTextEl.textContent = passage.text;
            passageExplanationEl.textContent = passage.explanation;
            
            // 重置UI状态
            feedbackArea.style.display = 'none';
            translationInputEl.value = '';
        }

        // 提交翻译
        function submitTranslation() {
            if (!isGameActive) return;
            
            const userTranslation = translationInputEl.value.trim();
            if (!userTranslation) {
                Toast.warning('请输入您的翻译');
                return;
            }
            
            const passage = oraclePassages[currentPassage];
            
            // 计算得分
            const { score: passageScore, accuracy } = calculateScore(userTranslation, passage);
            
            // 更新总分
            score += passageScore;
            totalAccuracy += accuracy;
            
            // 显示反馈
            feedbackArea.style.display = 'block';
            feedbackTitle.textContent = "翻译结果";
            currentScoreEl.textContent = passageScore;
            userTranslationTextEl.textContent = userTranslation;
            referenceTranslationTextEl.textContent = passage.reference;
            detailedExplanationEl.textContent = passage.detailed;
            
            updateStats();
        }

        // 计算得分
        function calculateScore(userTranslation, passage) {
            let matchedKeywords = 0;
            const userWords = userTranslation.replace(/[，。！？；：,.!?;:]/g, '').split(/\s+/);
            
            // 检查关键词匹配
            passage.keywords.forEach(keyword => {
                if (userTranslation.includes(keyword)) {
                    matchedKeywords++;
                }
            });
            
            // 计算准确率
            const accuracy = Math.round((matchedKeywords / passage.keywords.length) * 100);
            
            // 根据难度和准确率计算得分
            const baseScore = passage.difficulty * 10;
            const score = Math.round(baseScore * (accuracy / 100));
            
            return { score, accuracy };
        }

        // 下一段落
        function nextPassage() {
            currentPassage++;
            
            if (currentPassage < oraclePassages.length) {
                loadPassage();
            } else {
                // 游戏结束
                isGameActive = false;
                showResults();
            }
        }

        // 显示结果
        function showResults() {
            const finalAccuracy = Math.round(totalAccuracy / oraclePassages.length);
            
            finalScoreEl.textContent = `${score}分`;
            
            let message = `你完成了${oraclePassages.length}段甲骨文的翻译挑战！`;
            if (score >= 120) {
                message = "太棒了！你对甲骨文有很深的理解，是真正的甲骨文大师！";
            } else if (score >= 80) {
                message = "很好！你对甲骨文有不错的了解，继续努力！";
            } else if (score >= 50) {
                message = "不错！你对甲骨文有一定了解，可以再多学习一些。";
            } else {
                message = "继续努力，多了解甲骨文知识会更好。";
            }
            message += ` 整体准确率: ${finalAccuracy}%`;
            
            resultMessageEl.textContent = message;
            resultOverlay.classList.add('active');
        }

        // 提示功能
        function showHint() {
            if (!isGameActive) return;
            
            const passage = oraclePassages[currentPassage];
            const keywords = passage.keywords.join('、');
            
            Toast.info(`提示：尝试在翻译中包含这些关键词：${keywords}`);
        }

        // 事件监听
        submitBtn.addEventListener('click', submitTranslation);
        nextBtn.addEventListener('click', nextPassage);
        hintBtn.addEventListener('click', showHint);
        restartBtn.addEventListener('click', initGame);

        // 初始化游戏
        initGame();
    </script>
    <script src="./js/common.js"></script>
</body>
</html>

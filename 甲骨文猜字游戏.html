<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲骨文猜字游戏</title>
    <link rel="stylesheet" href="./css/enhance.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'STKaiti', 'KaiTi', serif;
        }

        /* ===== 整体背景：渐变米黄色 ===== */
        body {
            background: linear-gradient(135deg, #f5f1e6 0%, #ede4d0 50%, #f5f1e6 100%);
            color: #5c3d2e;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== 主容器卡片：圆角16px + 柔和阴影 ===== */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fffdf5;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(140, 94, 60, 0.18), 0 2px 8px rgba(140, 94, 60, 0.08);
            padding: 30px;
            border: 2px solid #d9c7a7;
            position: relative;
            overflow: hidden;
        }

        /* 容器顶部金色装饰条 */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #8c5e3c, #d4af37, #8c5e3c);
        }

        /* ===== header：金色装饰条 + 渐变背景 ===== */
        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 28px 15px 18px;
            border-radius: 14px;
            position: relative;
            background: linear-gradient(135deg, #8c5e3c 0%, #6d4429 100%);
            box-shadow: 0 6px 20px rgba(92, 61, 46, 0.25);
            border-bottom: 3px solid #d4af37;
            overflow: hidden;
        }

        /* header 金色装饰条 */
        header::after {
            content: "";
            display: block;
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 14px auto 0;
            border-radius: 2px;
        }

        h1 {
            color: #f5e6c8;
            font-size: 2.5rem;
            margin-bottom: 8px;
            letter-spacing: 6px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }

        header p {
            color: #e8d8b8;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        /* ===== game-info：金色装饰 + 数字渐变色 ===== */
        .game-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(135deg, #ede0c8 0%, #e8d8b8 100%);
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #6d4429;
            border: 1px solid #d4af37;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 3px 8px rgba(140, 94, 60, 0.1);
            position: relative;
        }

        /* game-info 中央金色装饰点 */
        .game-info::before {
            content: "◆";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #d4af37;
            font-size: 0.9rem;
            opacity: 0.75;
        }

        .game-info span {
            background: linear-gradient(135deg, #8c5e3c 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.35rem;
            margin-left: 4px;
        }

        .game-area {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 25px;
        }

        /* ===== 甲骨文展示区外框 ===== */
        .oracle-bone {
            flex: 1;
            min-width: 300px;
            background: linear-gradient(135deg, #f5f1e6 0%, #ede0c8 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(140, 94, 60, 0.12), 0 3px 10px rgba(140, 94, 60, 0.08);
            border: 1px solid #d4af37;
        }

        .oracle-bone h2 {
            color: #8c5e3c;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        /* ===== 甲骨文字展示区：宣纸质感（米黄渐变 + 内阴影） ===== */
        .oracle-character {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 18px 0;
            position: relative;
            background: radial-gradient(ellipse at center, #faf3e0 0%, #f0e6d2 70%, #e8dcc0 100%);
            border-radius: 10px;
            box-shadow:
                inset 0 0 30px rgba(140, 94, 60, 0.22),
                inset 0 0 6px rgba(140, 94, 60, 0.15);
            border: 1px dashed #c9a961;
            overflow: hidden;
        }

        /* 宣纸纹理装饰 */
        .oracle-character::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(140, 94, 60, 0.04) 1px, transparent 2px),
                radial-gradient(circle at 70% 60%, rgba(140, 94, 60, 0.04) 1px, transparent 2px),
                radial-gradient(circle at 40% 80%, rgba(140, 94, 60, 0.03) 1px, transparent 2px);
            background-size: 60px 60px, 80px 80px, 50px 50px;
            pointer-events: none;
        }

        .oracle-character img {
            position: relative;
            z-index: 1;
            filter: drop-shadow(2px 2px 3px rgba(92, 61, 46, 0.3));
        }

        .oracle-bone p {
            color: #6d4429;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* ===== 选项按钮：渐变背景 + 悬浮上移 ===== */
        .options {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        .option {
            background: linear-gradient(135deg, #f0e0c0 0%, #e8d8b8 100%);
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 2px 5px rgba(140, 94, 60, 0.12);
            color: #5c3d2e;
            font-weight: 600;
        }

        .option:hover {
            background: linear-gradient(135deg, #e8d8b8 0%, #d9c7a7 100%);
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(140, 94, 60, 0.22);
            border-color: #d4af37;
        }

        /* 选中正确：绿色视觉反馈 */
        .option.correct {
            background: linear-gradient(135deg, #b8e0a8 0%, #8fcf7f 100%);
            border-color: #4a8a3a;
            box-shadow: 0 4px 14px rgba(74, 138, 58, 0.45);
            color: #2d5a1d;
            animation: pop 0.4s ease;
        }

        /* 选中错误：红色视觉反馈 */
        .option.incorrect {
            background: linear-gradient(135deg, #f0b0b0 0%, #e88888 100%);
            border-color: #b85c5c;
            box-shadow: 0 4px 14px rgba(184, 92, 92, 0.45);
            color: #7a2d2d;
            animation: shake 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .feedback {
            text-align: center;
            padding: 16px;
            margin: 20px 0;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #8c5e3c 0%, #6d4429 100%);
            color: #f5e6c8;
            border: 2px solid transparent;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            box-shadow: 0 4px 12px rgba(140, 94, 60, 0.3);
        }

        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #a0522d 0%, #8c5e3c 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(140, 94, 60, 0.4);
            border-color: #d4af37;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        #restart-btn {
            background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
            color: #3d2817;
        }

        #restart-btn:hover {
            background: linear-gradient(135deg, #e8c547 0%, #d4af37 100%);
            border-color: #8c5e3c;
        }

        .instructions {
            background: linear-gradient(135deg, #f5f1e6 0%, #ede0c8 100%);
            padding: 22px 24px;
            border-radius: 12px;
            margin-top: 25px;
            border-left: 5px solid #d4af37;
            box-shadow: inset 0 0 15px rgba(140, 94, 60, 0.08);
        }

        .instructions h2 {
            margin-bottom: 12px;
            color: #8c5e3c;
            letter-spacing: 3px;
            position: relative;
            padding-bottom: 8px;
        }

        .instructions h2::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, transparent);
            border-radius: 2px;
        }

        .instructions p {
            line-height: 1.8;
            margin-bottom: 8px;
            color: #6d4429;
        }

        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }
            h1 { font-size: 2rem; }
            .game-info::before { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>甲骨文猜字游戏</h1>
            <p>探索古老文字，测试你的汉字知识</p >
        </header>
        
        <div class="game-info">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="progress">进度: <span id="progress">1</span>/10</div>
        </div>
        
        <div class="game-area">
            <div class="oracle-bone">
                <h2>甲骨文字符</h2>
                <div class="oracle-character" id="oracle-character">
                    <!-- 甲骨文图形将通过JavaScript动态生成 -->
                </div>
                <p>观察上面的甲骨文，选择对应的现代汉字</p >
            </div>
            
            <div class="options" id="options">
                <!-- 选项将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <div class="feedback" id="feedback">
            请选择一个选项开始游戏
        </div>
        
        <div class="controls">
            <button id="next-btn" disabled>下一题</button>
            <button id="restart-btn">重新开始</button>
        </div>
        
        <div class="instructions">
            <h2>游戏说明</h2>
            <p>1. 观察左侧显示的甲骨文字符，从右侧选项中选择对应的现代汉字。</p >
            <p>2. 选择正确得10分，选择错误不扣分。</p >
            <p>3. 完成10道题目后查看最终得分。</p >
            <p>4. 甲骨文是中国商代晚期王室用于占卜记事而在龟甲或兽骨上契刻的文字，是中国及东亚已知最早的成体系文字。</p >
        </div>
    </div>
    <script src="./js/common.js"></script>
    <script src="./js/api.js"></script>
    <script>
        // ===== SVG 字典常量：甲骨文字符 -> SVG 文件路径 =====
        const ORACLE_SVG_DICT = {
            '人': './svg/人.svg',
            '日': './svg/日.svg',
            '月': './svg/月.svg',
            '水': './svg/水.svg',
            '火': './svg/火.svg',
            '木': './svg/木.svg',
            '山': './svg/山.svg',
            '雨': './svg/雨.svg'
        };

        // 根据甲骨文字符把对应 SVG 渲染到题目展示区域
        function renderOracleSVG(char) {
            const target = document.getElementById('oracle-character');
            if (!target) return;
            const svgPath = ORACLE_SVG_DICT[char];
            if (svgPath) {
                target.innerHTML = '<img src="' + svgPath + '" alt="' + char + '" style="width:140px;height:140px;filter:sepia(1) hue-rotate(15deg) saturate(2);">';
            } else if (char) {
                // 未匹配到 SVG 时回退为文字展示
                target.innerHTML = '<div style="font-size:5rem;color:#8c5e3c;font-weight:bold;font-family:STKaiti,serif;">' + char + '</div>';
            }
        }

        // DOMContentLoaded 后初始化 SVG 展示（兜底渲染一次）
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof oracleData !== 'undefined' && typeof currentQuestion !== 'undefined' && oracleData[currentQuestion]) {
                renderOracleSVG(oracleData[currentQuestion].oracle);
            }
        });
    </script>
    <script>
        // 甲骨文数据 - 使用CSS绘制的甲骨文图形
        const oracleData = [
            { 
                oracle: "人", 
                options: ["人", "大", "天", "木"], 
                answer: "人",
                element: '<div class="oracle-human"></div>'
            }, 
            { 
                oracle: "木", 
                options: ["林", "木", "森", "树"], 
                answer: "木",
                element: '<div class="oracle-tree"></div>'
            },
            { 
                oracle: "日", 
                options: ["日", "月", "明", "星"], 
                answer: "日",
                element: '<div class="oracle-sun"></div>'
            },
            { 
                oracle: "月", 
                options: ["月", "夕", "明", "有"], 
                answer: "月",
                element: '<div class="oracle-moon"></div>'
            },
            { 
                oracle: "水", 
                options: ["水", "冰", "河", "泉"], 
                answer: "水",
                element: '<div class="oracle-water"></div>'
            },
            { 
                oracle: "火", 
                options: ["火", "炎", "热", "灭"], 
                answer: "火",
                element: '<div class="oracle-fire"></div>'
            },
            { 
                oracle: "山", 
                options: ["山", "丘", "岳", "峰"], 
                answer: "山",
                element: '<div class="oracle-mountain"></div>'
            },
            { 
                oracle: "雨", 
                options: ["雨", "雪", "雷", "云"], 
                answer: "雨",
                element: '<div class="oracle-rain"><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div></div>'
            },
            { 
                oracle: "人", 
                options: ["人", "大", "天", "木"], 
                answer: "人",
                element: '<div class="oracle-human"></div>'
            },
            { 
                oracle: "木", 
                options: ["林", "木", "森", "树"], 
                answer: "木",
                element: '<div class="oracle-tree"></div>'
            }
        ];

        // 游戏状态
        let currentQuestion = 0;
        let score = 0;
        let gameCompleted = false;

        // DOM元素
        const oracleCharacterEl = document.getElementById('oracle-character');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        // 初始化游戏
        function initGame() {
            currentQuestion = 0;
            score = 0;
            gameCompleted = false;
            scoreEl.textContent = score;
            progressEl.textContent = `${currentQuestion + 1}/${oracleData.length}`;
            nextBtn.disabled = true;
            loadQuestion();
        }

        // 加载问题
        function loadQuestion() {
            const question = oracleData[currentQuestion];
            
            // 设置甲骨文图形（使用 SVG 展示）
            renderOracleSVG(question.oracle);
            
            // 清空选项
            optionsEl.innerHTML = '';
            
            // 随机排序选项
            const shuffledOptions = [...question.options].sort(() => Math.random() - 0.5);
            
            // 创建选项按钮
            shuffledOptions.forEach(option => {
                const optionEl = document.createElement('div');
                optionEl.className = 'option';
                optionEl.textContent = option;
                optionEl.addEventListener('click', () => checkAnswer(option, optionEl));
                optionsEl.appendChild(optionEl);
            });
            
            feedbackEl.textContent = '请选择一个选项';
            feedbackEl.style.backgroundColor = '#f0e6d2';
        }

        // 检查答案
        function checkAnswer(selectedOption, optionEl) {
            if (gameCompleted) return;
            
            const question = oracleData[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            // 禁用所有选项
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
            });
            
            // 标记正确和错误答案
            options.forEach(opt => {
                if (opt.textContent === question.answer) {
                    opt.classList.add('correct');
                } else if (opt === optionEl && selectedOption !== question.answer) {
                    opt.classList.add('incorrect');
                }
            });
            
            // 显示反馈
            if (selectedOption === question.answer) {
                feedbackEl.textContent = '回答正确！';
                feedbackEl.style.backgroundColor = '#a8d5a2';
                score += 10;
                scoreEl.textContent = score;
            } else {
                feedbackEl.textContent = `回答错误！正确答案是：${question.answer}`;
                feedbackEl.style.backgroundColor = '#e8a8a8';
            }
            
            nextBtn.disabled = false;
        }

        // 下一题
        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < oracleData.length) {
                progressEl.textContent = `${currentQuestion + 1}/${oracleData.length}`;
                loadQuestion();
                nextBtn.disabled = true;
            } else {
                // 游戏结束
                gameCompleted = true;
                oracleCharacterEl.innerHTML = '<div style="font-size: 3rem;color:#8c5e3c;font-weight:bold;">结束</div>';
                optionsEl.innerHTML = '';
                feedbackEl.textContent = `游戏结束！你的最终得分是：${score}`;
                feedbackEl.style.backgroundColor = '#e8d8b8';
                nextBtn.disabled = true;
                
                const username = localStorage.getItem('oracle_currentUser') ? JSON.parse(localStorage.getItem('oracle_currentUser')).username : '匿名用户';
                API.submitScore(username, 'guess_char', score).then(res => {
                    if (res.success) {
                        feedbackEl.textContent += '（成绩已保存）';
                    }
                }).catch(() => {});
            }
        }

        // 事件监听
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', initGame);

        // 启动游戏
        initGame();
    </script>
</body>
</html>
